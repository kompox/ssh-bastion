services:
  ssh-bastion:
    build: .
    image: ssh-bastion:local
    command: ["serve", "-http-addr", ":8080", "-dns=true", "-dns-addr", ":53", "-dns-upstream", "127.0.0.11:53"]
    environment:
      SSHBASTION_DATA_DIR: /data
      SSHBASTION_AUTH_MODE: easy_auth
      SSHBASTION_AUTH_OVERRIDE_USER_ID: test-user-123
      SSHBASTION_AUTH_OVERRIDE_EMAIL: developer@localhost
      SSHBASTION_LOG_LEVEL: info
      SSHBASTION_ROLE_DEFAULT: admin
    volumes:
      - ${SSHBASTION_HOST_DATA_DIR:-./_tmp/data}:/data
    ports:
      - "2222:22"
      - "8080:8080"
      - "5353:53/udp"

  sshd:
    image: ssh-bastion:local
    depends_on:
      - ssh-bastion
    network_mode: service:ssh-bastion
    entrypoint: ["/usr/local/bin/ssh-entrypoint"]
    environment:
      SSHBASTION_DATA_DIR: /data
      SSHBASTION_SSHD_NAMESERVER: 127.0.0.1
      SSHBASTION_SSHD_LOG_LEVEL: VERBOSE
    volumes:
      - ${SSHBASTION_HOST_DATA_DIR:-./_tmp/data}:/data
